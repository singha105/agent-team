# Runs the AgentTeam API. Agent commands still execute in separate, disposable
# sandbox containers — this compose file does not change that.
#
# READ THIS BEFORE USING IT
#
# The api service mounts the host Docker socket. That is what lets it create
# sibling sandbox containers, and it means the api container can control the
# host daemon — effectively root on the host. The trust boundary is unchanged
# from running on the host directly: *AgentTeam's own code* is trusted, and
# *agent-generated code* is not. Agent code never runs in this container; it
# runs in the locked-down sibling container (no network, read-only rootfs,
# dropped capabilities). Do not add agent-controlled input to this service's
# command or environment.
#
# If you are not comfortable mounting the socket, run the API on the host
# instead — `uvicorn app.main:app --reload` — which needs no socket mount.

services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or .env}
      AGENTTEAM_DB_PATH: /srv/data/agentteam.db
      AGENTTEAM_WORKSPACE_ROOT: /srv/workspace
      # The sandbox's --volume flag is resolved by the HOST daemon, so it has
      # to name a host path. Without this the API would ask the daemon to mount
      # /srv/workspace, which does not exist on the host.
      AGENTTEAM_HOST_WORKSPACE_ROOT: ${PWD}/workspace
      AGENTTEAM_SANDBOX_MODE: docker
      AGENTTEAM_SANDBOX_IMAGE: agentteam-runtime:latest
    volumes:
      - ./workspace:/srv/workspace
      - ./data:/srv/data
      - ./config:/srv/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  # Builds the sandbox runtime image and exits. The api service will not start
  # until this succeeds, so the first `run_command` never fails on a missing
  # image.
  sandbox-image:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: agentteam-runtime:latest
    command: ["python", "--version"]
