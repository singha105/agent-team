# Per-model API rates in USD per million tokens.
#
# Source: Anthropic published pricing. Update this file when rates change —
# no code change is required. Cost is computed in backend/app/core/pricing.py.
#
# cache_write is the rate for tokens written to the prompt cache (1.25x input).
# cache_read is the rate for tokens served from the cache (0.1x input).

models:
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50

  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20

  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
