server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend is a single-page app: any path that is not a real file has to
    # fall through to index.html, or a refresh on a deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API and WebSocket, so the browser never deals with CORS and
    # the deployment matches how it behaves behind a reverse proxy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent runs are long; the default 60s would cut a task off mid-flight.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A WebSocket that idles between events must not be reaped; the room can
        # be quiet for minutes while an agent thinks.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or a
    # deploy leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
