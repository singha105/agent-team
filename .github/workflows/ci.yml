name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy
        run: mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Built so the sandbox integration tests actually run rather than
      # skipping. Ubuntu runners ship a working Docker daemon.
      - name: Build sandbox runtime image
        run: docker build -t agentteam-runtime:latest docker/

      - name: Migrations apply cleanly
        run: alembic -c backend/alembic.ini upgrade head

      - name: Generated TypeScript is in sync
        # The event schemas are the frontend's contract. If they drift from the
        # committed .ts, the mismatch surfaces as a runtime bug in the browser
        # rather than a type error anywhere.
        run: python scripts/export_types.py --check

      - name: Tests
        run: pytest -q
        env:
          # Deliberately unset: no test may require a live API key. A test that
          # needs one is a test that spends money in CI.
          ANTHROPIC_API_KEY: ""

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: No known vulnerabilities
        # The dependency versions were chosen to reach zero; this stops them
        # drifting back without anyone noticing.
        run: npm audit --audit-level=high

  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          ANTHROPIC_API_KEY: ci-placeholder

      # Built, not just parsed. A Dockerfile that only type-checks is a
      # Dockerfile nobody has run, and the exit criterion is that a clean clone
      # comes up with one command.
      - name: Build the sandbox runtime image
        run: docker build -t agentteam-runtime:latest docker/

      - name: Build the API image
        run: docker build -f docker/backend.Dockerfile -t agentteam-api:ci .

      - name: Build the web image
        run: docker build -f docker/frontend.Dockerfile -t agentteam-web:ci .

      - name: The API image starts and reports healthy
        run: |
          docker run -d --name api-smoke \
            -e ANTHROPIC_API_KEY=ci-placeholder \
            -e AGENTTEAM_SANDBOX_MODE=subprocess \
            -p 8000:8000 agentteam-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -sS http://127.0.0.1:8000/health
              docker rm -f api-smoke
              exit 0
            fi
            sleep 1
          done
          echo "the API image never became healthy"
          docker logs api-smoke
          docker rm -f api-smoke
          exit 1
